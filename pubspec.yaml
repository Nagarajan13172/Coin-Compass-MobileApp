name: coincompass
description: "CoinCompass — Personal Finance Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state
  flutter_riverpod: ^2.6.1

  # networking (cookie-based session auth)
  dio: ^5.11.0
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9

  # routing
  go_router: ^17.5.0

  # ui
  fl_chart: ^1.2.0
  lucide_icons_flutter: ^3.1.17

  # platform / storage
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  file_picker: ^12.0.0
  share_plus: ^13.3.0

  # utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
