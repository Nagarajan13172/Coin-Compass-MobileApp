name: coincompass
description: "CoinCompass — Personal Finance Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state
  flutter_riverpod: ^2.6.1

  # networking (cookie-based session auth)
  dio: ^5.11.0
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9

  # routing
  go_router: ^17.5.0

  # ui
  fl_chart: ^1.2.0
  lucide_icons_flutter: ^3.1.17

  # platform / storage
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  file_picker: ^12.0.0
  share_plus: ^13.3.0

  # utils
  intl: ^0.20.2

  # PBKDF2-HMAC-SHA256 for the app lock's local PIN verifier. Already resolved
  # at 3.0.7 transitively (via dio); promoted to a direct dependency because
  # `depend_on_referenced_packages` rejects importing a transitive one. Pure
  # Dart, no platform code — it cannot repeat the flutter_secure_storage
  # compileSdk problem.
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Phase 7.1b — turns on `flutter gen-l10n`, which builds `L` from the ARB
  # files in lib/l10n. This is the flutter tool's own generator, not
  # build_runner; the project's no-codegen rule was about freezed and
  # json_serializable, and hand-written fromJson stays exactly as it is.
  generate: true
  assets:
    - assets/i18n/
    # The OFL requires the licence to travel with the font it covers, so it is
    # a bundled asset rather than a repo-only file.
    - assets/fonts/OFL-NotoSansTamil.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Fallback only — see AppTheme.fontFamilyFallback. Inter has no Tamil
    # glyphs, so without this every Tamil string renders as tofu. Latin text
    # never reaches it, so English metrics are untouched.
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTamil-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTamil-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
